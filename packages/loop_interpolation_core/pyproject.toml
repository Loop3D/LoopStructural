[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "loop-interpolation-core"
version = "0.1.0"
description = "Native (Rust) core for the low-memory LoopStructural interpolator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
features = ["python", "parallel"]
module-name = "loop_interpolation_core"
