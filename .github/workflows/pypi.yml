name: "📦 PyPI "
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # loop-interpolation-core is the Rust core behind the optional extra
  # loop-interpolation[native]. It has compiled wheels, so it is built by
  # core-wheels.yml and not by the sdist matrix below. No other package
  # waits for it: a failed core upload does not stop their release.
  build_core:
    name: Build loop-interpolation-core
    uses: ./.github/workflows/core-wheels.yml

  # Trusted publishing (OIDC): no password. PyPI must list this repository
  # and the workflow file pypi.yml as a trusted publisher of the project.
  upload_core_to_pypi:
    name: Upload loop-interpolation-core to PyPI
    needs: ["build_core"]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # loop_common/loop_interpolation/loopstructural_visualisation are
  # workspace-local deps of LoopStructural (see [tool.uv.sources] in
  # pyproject.toml) — loop_common/loop_interpolation are runtime deps,
  # loopstructural_visualisation backs the `visualisation`/`docs` extras.
  # They must land on PyPI before the LoopStructural sdist below is
  # uploaded, or `pip install LoopStructural[...]` breaks for anyone not
  # using uv. map2loop (ROADMAP.md Stage 4, outcome 7) has no such reverse
  # dependency — it rides in the same matrix purely for its own independent
  # PyPI publishing, not for a gating reason.
  make_sdist_packages:
    name: Make SDist (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [loop_common, loop_interpolation, map2loop, loopstructural_visualisation]
    steps:
      - uses: actions/checkout@v4

      - name: Build SDist
        working-directory: packages/${{ matrix.package }}
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/

  upload_packages_to_pypi:
    name: Upload ${{ matrix.package }} to PyPI
    needs: ["make_sdist_packages"]
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        package: [loop_common, loop_interpolation, map2loop, loopstructural_visualisation]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          verbose: true
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SDist
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  upload_to_pypi:
    needs: ["make_sdist", "upload_packages_to_pypi"]
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          verbose: true
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}